/* HUD chrome shared by every sim. 1rem = 10px at the 1080x1350 reference
   size; runtime sets html font-size from the viewport so it scales. */

:root {
  --bg: #09090a;
  --fg: #ece6d6;
  --dim: rgba(236, 230, 214, 0.64);
  --mute: rgba(236, 230, 214, 0.38);
  --faint: rgba(236, 230, 214, 0.16);
  --line: rgba(236, 230, 214, 0.14);
  --panel: rgba(9, 9, 10, 0.9);
  --accent: #f2b632;
  --top: 13.4rem;
  --bot: 30.5rem;
}
:root[data-theme='light'] {
  --bg: #f3f2ee;
  --fg: #151515;
  --dim: rgba(21, 21, 21, 0.66);
  --mute: rgba(21, 21, 21, 0.42);
  --faint: rgba(21, 21, 21, 0.16);
  --line: rgba(21, 21, 21, 0.16);
  --panel: rgba(243, 242, 238, 0.93);
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
#app {
  position: fixed; inset: 0; color: var(--fg);
  font-family: 'JetBrains Mono', ui-monospace, monospace;
  font-variant-ligatures: none; -webkit-font-smoothing: antialiased;
}
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.hud { position: absolute; inset: 0; pointer-events: none; }
.hud.hidden { display: none; }
.accent { color: var(--accent); }

/* header */
.hdr {
  position: absolute; left: 0; right: 0; top: 0; height: var(--top);
  padding: 2.4rem 2.8rem 0;
  background: linear-gradient(var(--bg) 0%, var(--bg) 78%, transparent 100%);
}
.row { display: flex; align-items: baseline; white-space: nowrap; }
.row1 { gap: 5.6rem; }
.title { display: flex; align-items: center; gap: 1.3rem; font-size: 3.6rem; font-weight: 600; letter-spacing: 0.04em; }
.title .bar { display: inline-block; width: 0.75rem; height: 3.6rem; background: var(--accent); }
.sub { font-size: 1.75rem; color: var(--dim); letter-spacing: 0.08em; }
.right { margin-left: auto; font-size: 1.6rem; color: var(--dim); letter-spacing: 0.1em; }
.row2 { margin-top: 2rem; font-size: 1.95rem; }
.row2 .stage { width: 21rem; letter-spacing: 0.05em; }
.row2 .cmd { color: var(--fg); }
.row2 .time { margin-left: auto; letter-spacing: 0.05em; }
.prog { position: absolute; left: 2.8rem; right: 2.8rem; bottom: 1.2rem; height: 0.35rem; }
.prog i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); }

/* viewport overlays */
.ann { position: absolute; inset: 0; overflow: hidden; }
.ann div {
  position: absolute; transform: translate(1.4rem, -50%); white-space: nowrap;
  font-size: 1.7rem; letter-spacing: 0.04em; color: var(--fg);
  text-shadow: 0 0 0.6rem var(--bg), 0 0 1.2rem var(--bg);
}
.ann div.a { color: var(--accent); }
.ann div.box {
  padding: 0.8rem 1.1rem; border: 1px solid var(--line); background: var(--panel);
  text-shadow: none; line-height: 1.45; font-size: 1.55rem;
}
.ann div.box b { color: var(--accent); font-weight: 600; }
.wm {
  position: absolute; right: 3rem; bottom: calc(var(--bot) + 1.6rem);
  font-size: 2.3rem; letter-spacing: 0.06em; color: var(--fg); opacity: 0.3;
}

/* bottom panel */
.bot {
  position: absolute; left: 0; right: 0; bottom: 0; height: var(--bot);
  display: flex; border-top: 1px solid var(--line); background: var(--panel);
  padding: 2rem 2.8rem 1.6rem;
}
.term { flex: 1; min-width: 0; display: flex; flex-direction: column; padding-right: 2.6rem; }
.thead { display: flex; align-items: baseline; gap: 2.4rem; font-size: 1.75rem; white-space: nowrap; }
.thead .host { font-size: 2.1rem; }
.thead .path { color: var(--dim); }
.thead .status { margin-left: auto; font-size: 1.5rem; letter-spacing: 0.1em; display: flex; align-items: center; gap: 0.9rem; }
.thead .status i { width: 1rem; height: 1rem; border-radius: 50%; background: var(--accent); display: inline-block; }
.prompt { margin-top: 1.9rem; font-size: 2.2rem; white-space: nowrap; overflow: hidden; }
.logs { margin-top: 1.1rem; font-size: 1.85rem; line-height: 1.52; flex: 1; overflow: hidden; }
.logs div { white-space: nowrap; overflow: hidden; text-overflow: clip; }
.logs .ln { color: var(--mute); display: inline-block; width: 6.4rem; }
.logs .hl { color: var(--accent); }
.caret { display: inline-block; width: 0.95em; height: 1.05em; vertical-align: -0.15em; background: var(--accent); margin-left: 0.15em; }
.tfoot { font-size: 1.35rem; color: var(--mute); white-space: nowrap; letter-spacing: 0.04em; }
.side {
  width: 31%; border-left: 1px solid var(--line); padding-left: 2.2rem;
  display: flex; flex-direction: column;
}
.shead { font-size: 1.45rem; letter-spacing: 0.12em; }
.mini { width: 100%; flex: 1; min-height: 0; display: block; margin: 0.8rem 0; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem 1.4rem; font-size: 1.35rem; color: var(--mute); }
.stats b { display: block; font-size: 2rem; color: var(--fg); font-weight: 600; letter-spacing: 0.02em; }
.sfoot { margin-top: 0.8rem; font-size: 1.3rem; color: var(--mute); letter-spacing: 0.05em; }
.baseline { position: absolute; left: 2.8rem; right: 2.8rem; bottom: 0.9rem; height: 0.25rem; background: var(--line); }
.baseline i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); }

/* director layers */
.dir-glitch { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.dir-flash {
  position: absolute; inset: 0; pointer-events: none; opacity: 0; mix-blend-mode: screen;
  background: radial-gradient(ellipse 75% 55% at 50% 45%, var(--accent) 0%, transparent 70%), rgba(255,255,255,0.18);
}
.dir-story {
  position: absolute; left: 0; right: 0; top: 0; bottom: 0; pointer-events: none;
  display: flex; align-items: flex-end; justify-content: center; padding: 0 4.5rem 6rem; opacity: 0;
}
.cap { text-align: center; max-width: 96rem; position: relative; }
.cap::before {
  content: ''; position: absolute; inset: -6rem -10rem; z-index: -1;
  background: radial-gradient(ellipse 50% 50% at 50% 55%, rgba(0,0,0,0.62) 0%, rgba(0,0,0,0) 100%);
}
:root[data-theme='light'] .cap::before { background: radial-gradient(ellipse 50% 50% at 50% 55%, rgba(243,242,238,0.8) 0%, rgba(243,242,238,0) 100%); }
.cap-main {
  font-family: 'Inter', 'Inter Variable', system-ui, sans-serif; font-weight: 800;
  font-size: 11.5rem; line-height: 0.98; letter-spacing: -0.035em; color: var(--fg);
  text-shadow: 0 0.4rem 2.4rem rgba(0,0,0,0.55);
}
.cap.num .cap-main { font-size: 15rem; font-variant-numeric: tabular-nums; letter-spacing: -0.045em; }
.cap-main .w { display: inline-block; transform-origin: 50% 70%; }
.cap-main .w.hl { background: var(--accent); color: #0a0a0a; padding: 0 0.14em; text-shadow: none; border-radius: 0.06em; }
.cap-sub {
  margin-top: 2rem; font-size: 2.7rem; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--fg); opacity: 0.85; min-height: 1.3em;
}
.cap-tag {
  display: inline-block; margin-bottom: 1.8rem; padding: 0.5rem 1.2rem; font-size: 2.2rem; letter-spacing: 0.12em;
  border: 1px solid var(--accent); color: var(--accent); background: rgba(0,0,0,0.5);
}

html, body { background: #eef1ea; overflow: hidden; touch-action: none; overscroll-behavior: none; }
#app {
  position: absolute !important; inset: auto !important; left: 0; top: 0; width: 1600px; height: 900px;
  transform-origin: 0 0; font-family: 'Inter', system-ui, sans-serif; color: #1d2a22;
}
#gl { touch-action: none; cursor: grab; }
#gl.drag { cursor: grabbing; }
.ui { position: absolute; inset: 0; pointer-events: none; --acc: #ff6a1f; --ink: #1d2a22; --soft: #5d6b62; --pan: rgba(255,255,255,.94); --line: #dfe4da; }
.ui button, .ui li, .ui input { pointer-events: auto; font-family: inherit; }
.ui button { cursor: pointer; }

.head { position: absolute; left: 36px; top: 26px; }
.head h1 { margin: 0; font-size: 38px; font-weight: 800; letter-spacing: -0.5px; }
.head p { margin: 4px 0 0; font-size: 19px; font-weight: 600; color: var(--soft); }
.ui.night .head h1, .ui.night .head p { color: #eef2ff; }

.nav { position: absolute; left: 36px; top: 132px; width: 262px; display: flex; flex-direction: column; gap: 9px; }
.ch {
  display: flex; align-items: center; gap: 12px; height: 56px; padding: 0 14px; border: 2px solid var(--line);
  border-radius: 14px; background: var(--pan); color: var(--ink); font-size: 21px; font-weight: 700; text-align: left;
  box-shadow: 0 2px 6px rgba(30,50,30,.06); transition: transform .15s, border-color .15s;
}
.ch .ic { font-size: 24px; width: 30px; text-align: center; }
.ch kbd { margin-left: auto; font: 600 13px 'JetBrains Mono', monospace; color: #9aa59d; }
.ch:hover { transform: translateX(3px); }
.ch.on { border-color: var(--acc); background: #fff3ec; }
.ch.on kbd { color: var(--acc); }

.card {
  position: absolute; right: 36px; top: 26px; width: 404px; padding: 20px 22px; border-radius: 18px;
  background: var(--pan); border: 2px solid var(--line); box-shadow: 0 4px 14px rgba(30,50,30,.08); pointer-events: auto;
}
.card h2 { margin: 0 0 10px; font-size: 28px; font-weight: 800; line-height: 1.15; color: var(--acc); }
.card .txt { margin: 0; font-size: 19px; line-height: 1.42; font-weight: 500; }
.card .tip { margin: 12px 0 0; padding: 10px 12px; border-radius: 10px; background: #f3f6ef; font-size: 18px; line-height: 1.38; font-weight: 600; }
.nums { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; margin-top: 14px; }
.num { padding: 8px 12px; border-radius: 12px; background: #f3f6ef; }
.num.big { grid-column: span 1; }
.num i { display: block; font-style: normal; font-size: 15px; font-weight: 700; color: var(--soft); text-transform: uppercase; letter-spacing: .4px; }
.num b { display: block; font-size: 30px; font-weight: 800; line-height: 1.15; font-variant-numeric: tabular-nums; }
.num b small { font-size: 17px; font-weight: 700; color: var(--soft); }
.num > small { display: block; font-size: 15px; font-weight: 600; color: var(--soft); }
.gears { display: flex; gap: 3px; margin-top: 4px; }
.gears span { flex: 1; height: 20px; border-radius: 4px; background: #dde3d6; font-size: 12px; font-weight: 700; color: #8b968e; text-align: center; line-height: 20px; }
.gears span.on { background: var(--acc); color: #fff; }
.bar { height: 12px; margin-top: 6px; border-radius: 6px; background: #dde3d6; overflow: hidden; }
.bar span { display: block; height: 100%; border-radius: 6px; background: linear-gradient(90deg, #45b36b, #f2c230 60%, #e5482c); transition: width .25s; }
.num.hard b { color: #d6361b; font-size: 25px; }

.check { margin: 14px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; }
.check li { display: flex; gap: 10px; align-items: flex-start; padding: 6px 10px; border-radius: 10px; font-size: 17px; font-weight: 600; line-height: 1.3; cursor: pointer; border: 2px solid transparent; background: #f3f6ef; }
.check li b { color: #2f9c55; font-size: 20px; }
.check li.on { border-color: var(--acc); background: #fff3ec; }
.note { margin: 12px 0 0; font-size: 17px; font-weight: 700; color: var(--soft); }

.controls { position: absolute; left: 330px; right: 470px; bottom: 26px; display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; align-items: center; }
.ctl {
  height: 56px; padding: 0 18px; border: 2px solid var(--line); border-radius: 14px; background: var(--pan); color: var(--ink);
  font-size: 20px; font-weight: 700; box-shadow: 0 2px 6px rgba(30,50,30,.07); user-select: none; touch-action: none;
}
.ctl.wide { min-width: 210px; }
.ctl.sq { width: 56px; padding: 0; font-size: 30px; line-height: 1; }
.ctl.on { border-color: var(--acc); background: var(--acc); color: #fff; }
.ctl:disabled { opacity: .4; cursor: default; }
.ctl:active { transform: scale(.97); }
.gearbox { display: flex; align-items: center; gap: 8px; }
.glbl { min-width: 92px; text-align: center; font-size: 21px; font-weight: 800; color: var(--ink); }
.ui.night .glbl, .ui.night .slider span { color: #eef2ff; }
.slider { display: flex; align-items: center; gap: 10px; height: 56px; padding: 0 14px; border-radius: 14px; background: var(--pan); border: 2px solid var(--line); }
.slider span { font-size: 18px; font-weight: 700; }
.slider input { width: 120px; accent-color: var(--acc); }
.ui.night .slider span { color: var(--ink); }

.lines { position: absolute; inset: 0; width: 1600px; height: 900px; overflow: visible; }
.lines line { stroke: var(--acc); stroke-width: 3; }
.lines circle { fill: #fff; stroke: var(--acc); stroke-width: 3.5; }
.labels { position: absolute; inset: 0; }
.lbl {
  position: absolute; left: 0; top: 0; padding: 8px 14px; border-radius: 12px; background: #fff; border: 3px solid var(--acc);
  font-size: 22px; font-weight: 800; white-space: nowrap; color: var(--ink); box-shadow: 0 3px 10px rgba(0,0,0,.12);
}
.bubble {
  position: absolute; left: 0; top: 0; padding: 10px 18px; border-radius: 20px; background: #fff; border: 3px solid var(--acc);
  font-size: 26px; font-weight: 800; color: var(--acc); transition: opacity .2s, transform .2s; opacity: 0;
}
.tourchip {
  position: absolute; left: 36px; top: 668px; display: flex; align-items: center; gap: 9px; height: 36px;
  padding: 0 16px; border: 2px solid var(--line); border-radius: 18px; background: var(--pan); color: var(--ink); font-size: 16px; font-weight: 700; white-space: nowrap;
}
.tourchip i { display: block; width: 9px; height: 9px; border-radius: 50%; background: var(--acc); animation: blink 1.2s steps(2) infinite; }
@keyframes blink { 50% { opacity: .15; } }
.turn { position: fixed; left: 0; right: 0; bottom: 18px; text-align: center; font: 700 16px Inter, sans-serif; color: #5d6b62; display: none; }
@media (orientation: portrait) and (max-width: 820px) { .turn { display: block; } }

</style>
